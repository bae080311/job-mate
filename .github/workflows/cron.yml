name: collect

# 스케줄은 "GitHub Actions 러너에서 닿는 DB"가 생긴 뒤에 켤 것.
# 로컬 docker DB에는 못 닿는다 → Neon/Supabase 무료 티어 붙이고 아래 2줄 주석 해제.
#  schedule:
#    - cron: "0 20 * * *"   # 05:00 KST
on:
  workflow_dispatch:
    inputs:
      pages:
        description: 소스별 수집 페이지 수
        default: "3"

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - run: npx tsc --noEmit
      - run: node src/pipeline/collect.ts --selftest
      - run: node src/pipeline/collect.ts --source saramin --pages ${{ inputs.pages }}
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          SARAMIN_ACCESS_KEY: ${{ secrets.SARAMIN_ACCESS_KEY }}
